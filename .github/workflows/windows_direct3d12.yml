name: Windows (Direct3D12)
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compile
        run: |
          cd paint
          ../base/make --compile

      - name: List build output (debug)
        shell: pwsh
        run: |
          if (Test-Path paint\build) {
            Get-ChildItem -Recurse paint\build
          } else {
            Write-Host "paint\build フォルダが存在しません。"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-Direct3D12
          path: paint/build/**
